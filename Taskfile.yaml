# https://taskfile.dev
version: "3"

env:
  CONNECT_ES_HTTP_SERVER_PORT: 8080
  CONNECT_ES_GRPC_SERVER_PORT: 8085
  TS_PROTO_HTTP_SERVER_PORT: 8081
  TS_PROTO_GRPC_SERVER_PORT: 8086

tasks:
  default:
    cmds:
      - task: install:prereqs
      - task: install:tools
      - task: install:deps

  install:prereqs:
    desc: Installs prerequisites
    cmds:
      - brew bundle
    sources:
      - Brewfile
    preconditions:
      - sh: command -v brew
        msg: "Please install Homebrew: https://brew.sh/"

  install:tools:
    desc: Installs tools
    run: once
    cmds:
      - mise install
      - mise current
      - corepack enable
    sources:
      - mise.toml

  install:deps:
    desc: Installs dependencies
    run: once
    cmds:
      - yarn install
    sources:
      - yarn.lock

  format:
    desc: Formats the code
    cmds:
      - task: format:proto
      - task: format:ts

  generate:
    desc: Generates the code
    cmds:
      - task: generate:proto
      - task: generate:openapi

  run:
    desc: Runs the application
    cmds:
      - yarn dev

  test:e2e:
    desc: Runs the e2e tests
    cmds:
      - yarn tsx connect-es-client/e2e.ts
      - yarn tsx ts-proto-client/e2e.ts

  test:e2e:grpcurl:
    desc: Runs the e2e tests using grpcurl
    deps:
      - export:proto-deps
    cmds:
      - |
        grpcurl -import-path .proto-deps -proto echo/v1/echo.proto -plaintext -d @ localhost:$CONNECT_ES_GRPC_SERVER_PORT echo.v1.EchoService/Echo <<EOM
        { "message": "Hi, connect-es!" }
        EOM
      - |
        grpcurl -import-path .proto-deps -proto echo/v1/echo.proto -plaintext -d @ localhost:$TS_PROTO_GRPC_SERVER_PORT echo.v1.EchoService/Echo <<EOM
        { "message": "Hi, ts-proto!" }
        EOM

  lint:
    desc: Lints the code
    cmds:
      - task: lint:proto

  format:proto:
    desc: Formats the proto files
    cmds:
      - buf format -w
    sources:
      - buf.yaml

  format:ts:
    desc: Formats the TypeScript files
    cmds:
      - yarn format
    sources:
      - tsconfig.json
      - ts-proto/**/*.ts

  lint:proto:
    desc: Lints the proto files
    cmds:
      - buf lint
    sources:
      - proto/**/*.proto
      - buf.yaml

  update:buf:deps:
    desc: Updates buf dependencies
    cmds:
      - buf dep update
    sources:
      - proto/**/*.proto
      - buf.yaml

  export:proto-deps:
    desc: Exports proto dependencies for grpcurl
    cmds:
      - buf export --output .proto-deps
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.lock

  generate:proto:
    desc: Generates the proto files
    cmds:
      - buf generate --include-imports
    sources:
      - proto/**/*.proto
      - buf.gen.yaml
      - buf.yaml

  generate:openapi:
    desc: Generates OpenAPI v2 from proto and converts to v3
    cmds:
      - buf generate --template buf.gen.openapiv2.yaml
      - rm -rf openapi/v3
      - find openapi/v2 -name '*.swagger.json' -exec sh -c 'outdir="openapi/v3/$(dirname "${1#openapi/v2/}")" && mkdir -p "$outdir" && yarn swagger2openapi "$1" -o "$outdir/$(basename "$1" .swagger.json).openapi.json"' _ {} \;
    sources:
      - proto/**/*.proto
      - buf.gen.openapiv2.yaml
      - buf.yaml
 